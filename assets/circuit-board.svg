<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <style>
      .trace { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .trace-accent { fill: none; stroke: rgba(0, 255, 204, 0.25); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: rgba(255, 255, 255, 0.25); }
      .node-accent { fill: rgba(0, 255, 204, 0.4); }
      .chip { fill: rgba(255, 255, 255, 0.03); stroke: rgba(255, 255, 255, 0.15); stroke-width: 1.5; }
      .chip-pin { fill: rgba(0, 255, 204, 0.3); }
    </style>
  </defs>

  <!-- Central Microchip Component -->
  <rect x="60" y="60" width="40" height="40" rx="3" class="chip" />
  <circle cx="80" cy="80" r="6" fill="rgba(0, 255, 204, 0.08)" stroke="rgba(0, 255, 204, 0.3)" stroke-width="1"/>
  <circle cx="80" cy="80" r="2" class="node-accent" />

  <!-- IC Pins -->
  <rect x="65" y="55" width="3" height="5" class="chip-pin" />
  <rect x="75" y="55" width="3" height="5" class="chip-pin" />
  <rect x="85" y="55" width="3" height="5" class="chip-pin" />
  <rect x="65" y="100" width="3" height="5" class="chip-pin" />
  <rect x="75" y="100" width="3" height="5" class="chip-pin" />
  <rect x="85" y="100" width="3" height="5" class="chip-pin" />
  <rect x="55" y="65" width="5" height="3" class="chip-pin" />
  <rect x="55" y="75" width="5" height="3" class="chip-pin" />
  <rect x="55" y="85" width="5" height="3" class="chip-pin" />
  <rect x="100" y="65" width="5" height="3" class="chip-pin" />
  <rect x="100" y="75" width="5" height="3" class="chip-pin" />
  <rect x="100" y="85" width="5" height="3" class="chip-pin" />

  <!-- PCB Circuit Traces with 45 degree bends and terminal pads -->
  <!-- Top Left Branch -->
  <path d="M 66 55 L 66 35 L 45 14 L 20 14" class="trace" />
  <circle cx="20" cy="14" r="3" class="node" />

  <path d="M 76 55 L 76 25 L 60 9 L 60 0" class="trace-accent" />
  <circle cx="76" cy="25" r="2.5" class="node-accent" />

  <path d="M 86 55 L 86 35 L 105 16 L 135 16 L 145 6 L 145 0" class="trace" />
  <circle cx="135" cy="16" r="3" class="node" />

  <!-- Left Side Traces -->
  <path d="M 55 66 L 35 66 L 15 46 L 0 46" class="trace" />
  <circle cx="35" cy="66" r="2.5" class="node" />

  <path d="M 55 76 L 25 76 L 10 91 L 10 120 L 0 130" class="trace-accent" />
  <circle cx="25" cy="76" r="3" class="node-accent" />
  <circle cx="10" cy="120" r="2.5" class="node" />

  <path d="M 55 86 L 40 86 L 25 101 L 25 140 L 15 150 L 0 150" class="trace" />
  <circle cx="25" cy="101" r="2.5" class="node" />

  <!-- Right Side Traces -->
  <path d="M 105 66 L 125 66 L 145 46 L 160 46" class="trace-accent" />
  <circle cx="125" cy="66" r="3" class="node-accent" />

  <path d="M 105 76 L 135 76 L 150 91 L 150 120 L 160 130" class="trace" />
  <circle cx="135" cy="76" r="2.5" class="node" />
  <circle cx="150" cy="120" r="3" class="node" />

  <path d="M 105 86 L 120 86 L 135 101 L 135 140 L 145 150 L 160 150" class="trace" />
  <circle cx="135" cy="101" r="2.5" class="node" />

  <!-- Bottom Traces -->
  <path d="M 66 105 L 66 125 L 45 146 L 20 146" class="trace-accent" />
  <circle cx="20" cy="146" r="3" class="node-accent" />

  <path d="M 76 105 L 76 135 L 60 151 L 60 160" class="trace" />
  <circle cx="76" cy="135" r="2.5" class="node" />

  <path d="M 86 105 L 86 125 L 105 144 L 135 144 L 145 154 L 145 160" class="trace" />
  <circle cx="135" cy="144" r="3" class="node" />

  <!-- Independent Auxiliary Tracks / Vias -->
  <circle cx="140" cy="80" r="3.5" class="node" />
  <circle cx="140" cy="80" r="1.5" fill="#000" />
  <path d="M 140 80 L 140 60 L 155 45" class="trace" />

  <circle cx="20" cy="80" r="3.5" class="node-accent" />
  <circle cx="20" cy="80" r="1.5" fill="#000" />
  <path d="M 20 80 L 20 100 L 35 115" class="trace" />

  <circle cx="80" cy="20" r="3" class="node" />
  <circle cx="80" cy="140" r="3" class="node-accent" />
</svg>
